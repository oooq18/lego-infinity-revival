  <script>
    let aegisIsIos = /iphone|ipad/i.test(navigator.userAgent);
     // 伽利略上报地址
    const url = 'https://galileotelemetry.tencent.com/collect';
    // 项目接入得到的token
    const id ='SDK-bc4521f9c0d4b159f9a5'; 
    let possibleRetCode = ['ret', 'retcode', 'code', 'errno', 'success']; // 默认错误码
    const env = true && !location.hostname.includes('apptest') ? 'production' : 'development';
    // 获取uid
    function getVuid() {
      let result = /(?:vqq_)?vuserid=(\w+)/.exec(document.cookie);
      return (result && result.length > 1) ? result[1] : ''
    }
    function isReportRequest(url) {
      return /btrace(\.video)?\.qq\.com\/kvcollect/.test(url) || 
            /oth\.eve\.mdt\.qq\.com/.test(url) || 
            /otheve\.beacon\.qq\.com/.test(url) || 
            /h\.trace\.qq\.com\/kv/.test(url) || 
            /iwan\.qq\.com\/api/.test(url) || 
            /snowflake\.qq\.com/.test(url);
    }

    function isWujiRequest(url) {
      return /v\.qq\.com\/cache\/wuji\/object/.test(url);
    }

    function getServerTiming() {
      // 例如: server-timing=rpc:123,ssr:456
      let serverTiming = /server-timing=([a-z:\d,]+)/.exec(document.cookie);
      if( !serverTiming || serverTiming.length < 2)  return [];
      return serverTiming[1]
        .split(',')
        .map(timing=>timing.split(':'))
        .filter(arr=>arr.length === 2 && arr[0] && arr[1])
    }

    /**
     * 过滤掉如下错误：
     * Script error. @ (:0:0) 已经把主动引入的JS加上的crossorigin，再有此报错应该是某些sdk自行引入的JS所导致
     * ReferenceError: Can't find variable: WebViewJavascriptBridge
     * TypeError: 'arguments', 'callee', and 'caller' cannot be accessed in strict mode.
     */
    function isFilterErrors(msg) {
      let errorsNeedToFiltered = [
        'script error',
        'webviewjavascriptbridge',
        'in strict mode',
        'onWebShow is not defined',
        'blocked by cors policy',
        'access-control-allow-headers',
        'traceparent is not allowed',
        'mixed content',
        'insecure favicon',
        'content must be served over https'
      ];
      msg = msg.toLocaleLowerCase();
      return errorsNeedToFiltered.some(function (err) {
        return msg.indexOf(err) > -1
      });
    }

    window.AegisV2 = new Aegis({
      id,
      // uid:getVuid(), // 获取uid
      hostUrl: {
        url,
        // whiteListUrl, 这个是获取采样和白名单的接口，如有需要可调整这个接口的配置
      },
      env, // 环境，默认 production
      plugin:{
        assetSpeed: true, // 是否开启资源测速上报
        spa: true,
        pv: true,
        aid: true, 
        error: true, 
        device: true,
        close: true, 
        session: true,
        blankScreen:true,
        performanceParams: {
          tag: 'iwan_game_vue3_ssr', // 用于终端webview性能优化专项统计
        },
        // api相关的上报
        api:{
          reportRequest: true, // 全量上报所有接口请求，默认 false，不上报
          apiDetail: true, // 上报接口请求的时候，是否上报请求 query 和 body，默认 false，不上报
          // 备选错误码,
          ret: [
            'errno',   // act.iwan.qq.com
            'success' // act.iwan.qq.com
          ],
          // session串联后端
          injectTraceHeader: 'traceparent', 
          // 不需要注入 trace 请求头
          injectTraceIgnoreUrls:[
            /btrace(\.video)?\.qq\.com\/kvcollect/, 
            /oth\.eve\.mdt\.qq\.com/, 
            /otheve\.beacon\.qq\.com/, 
            /h\.trace\.qq\.com\/kv/,
            /iwan\.qq\.com\/api/,
            /snowflake\.qq\.com/
          ],
          retCodeHandler(data, url, xhr) {
            try {
              let dataJson = null;
              if (isReportRequest(url)) {
                return {
                  isErr: false,
                  code: '0'
                }
              }

              if (!data) {
                return {
                  isErr: false,
                  code: 'unknown'
                }
              }

              if (typeof data === 'string') {
                dataJson = JSON.parse(data);
              }

              if (isWujiRequest(url)) {
                // wuji 200 is success
                return {
                  isErr: dataJson.code !== 200,
                  code: dataJson.code === 200 ? '0' : '' + dataJson.code,
                }
              }

              let keys = Object.getOwnPropertyNames(dataJson);
              let intersection = keys.filter(function (key) {
                return possibleRetCode.indexOf(key.toLocaleLowerCase()) > -1;
              });
              if (intersection.length > 0) {
                let code = intersection[0];
                return {
                  isErr: (+dataJson[code]) !== 0,
                  code: '' + dataJson[code],
                }
              }

              return {
                isErr: false,
                code: 'unknown'
              }
            } catch (e) {
              return {
                isErr: true,
                code: 'unknown'
              }
            }
          }
        },  
      },
      

      onBeforeSend(logs) {
        // console.log('AegisV2 onBeforeSend', logs);
        const filterLogs = logs.filter(log => {
          // 在发送数据前进行处理
          if ((log.msg && isFilterErrors(log.msg)) || (log.url && isReportRequest(log.url))) {
              return false;
          }
          return true;
        })
  
        return filterLogs;
      },
      // onBeforeSend(logs, aegis) {
      //   const filterLogs = logs.filter(log => log.type === 'api');
      //   console.log('AegisV2 onBeforeSend', logs, aegis);
      //   return filterLogs;
      // },
      beforeReportSpeed(logs) {
        // console.log('AegisV2 beforeReportSpeed', logs);
        const filterLogs = logs.filter(log => {
        // 在发送测速数据前进行处理
          if ((log.url && isReportRequest(log.url)) || (log.msg && isFilterErrors(log.msg))) {
            return false;
          }
          return true;
        })
        return filterLogs;
      },
    });
    
    window.AegisV2.setConfig({
      uid:getVuid(),
    })

    // 上报服务端 timing
    getServerTiming().forEach(function (timing) {
      window.AegisV2 && window.AegisV2.reportTime({
        name: timing[0],
        duration: +timing[1],
        ext1: aegisIsIos ? 'ios' : 'android',
        ext2: location.hostname,
        ext3: location.href
      });
    });
  </script>
